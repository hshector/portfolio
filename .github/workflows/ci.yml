name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Rebuild every day so new notes in the vault reach the site, and on demand from the Actions tab.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      VAULT_DIR: vault
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      HAS_VAULT_TOKEN: ${{ secrets.VAULT_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: Vault token missing
        if: env.HAS_VAULT_TOKEN != 'true'
        run: |
          echo "::error::The VAULT_TOKEN secret is not set, so the private vault cannot be read. See docs/DEPLOY.md."
          exit 1

      - name: Check out the vault (private, read-only token)
        uses: actions/checkout@v7
        with:
          repository: hshector/vault-libros
          token: ${{ secrets.VAULT_TOKEN }}
          path: vault
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - run: npm run check:dist

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Library report
        run: cat .generated/library-report.md >> "$GITHUB_STEP_SUMMARY"

      # Deploys only run once the Cloudflare secrets exist (see docs/DEPLOY.md).
      - name: Cloudflare not connected yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Cloudflare secrets are not set, so nothing was deployed. See docs/DEPLOY.md."

      - name: Deploy to production
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy

      - name: Check the live site
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          SITE: https://hector-portfolio.hectorsanchispont.workers.dev
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$SITE/" | grep -q 'Héctor Sanchis'; then break; fi
            [ "$i" = 6 ] && { echo "::error::$SITE/ did not serve the home page"; exit 1; }
            sleep 10
          done
          for path in /biblioteca /warrenia /constelacion /data/graph.json /data/graph.bin /biblioteca/daniel-yergin-the-prize /biblioteca/tema/finanzas; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE$path")
            [ "$code" = 200 ] || { echo "::error::$SITE$path returned $code"; exit 1; }
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/no-existe")" = 404
          enc=$(curl -s -o /dev/null -H 'Accept-Encoding: br, gzip' -w '%header{content-encoding}' "$SITE/data/graph.json")
          note=$(curl -s -o /dev/null -w '%{time_total}' "$SITE/biblioteca/bitcoin")
          echo "::notice::graph.json content-encoding: ${enc:-none} · a note page loads in ${note}s from the runner"
          echo "::notice::Live at $SITE"

      - name: Upload pull request preview
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}"
