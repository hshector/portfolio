name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: 'false'
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      # Deploys only run once the Cloudflare secrets exist (see docs/DEPLOY.md).
      - name: Cloudflare not connected yet
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::Cloudflare secrets are not set, so nothing was deployed. See docs/DEPLOY.md."

      - name: Deploy to production
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push'
        run: npx wrangler deploy

      - name: Check the live site
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'push'
        env:
          SITE: https://hector-portfolio.hectorsanchispont.workers.dev
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS "$SITE/" | grep -q 'Héctor Sanchis'; then break; fi
            [ "$i" = 6 ] && { echo "::error::$SITE/ did not serve the home page"; exit 1; }
            sleep 10
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' "$SITE/no-existe")" = 404
          echo "::notice::Live at $SITE"

      - name: Upload pull request preview
        if: env.CLOUDFLARE_API_TOKEN != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: npx wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}"
